name: release

# Delegates to armcknight/workflows' reusable SwiftPM cask-release pipeline:
# builds, (optionally signs+notarizes), tarballs, publishes to the
# armcknight/homebrew-tools tap, and bumps Casks/work.rb (or work-rc.rb for an
# RC tag). Requires TAP_RELEASE_TOKEN (Contents: read+write on the tap). To
# turn on signing, set `sign: true` and add the Developer ID + notary secrets.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    uses: armcknight/workflows/.github/workflows/swiftpm-cask-release.yml@1
    with:
      cask-name: work
      binaries: work
      version-file: Sources/work/CLI/Work.swift
      version-regex: '.*static let version = "([^"]+)".*'
    secrets: inherit
